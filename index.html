<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PLC Training: Ladder Logic IDE &amp; Simulator</title>
  <meta name="description" content="Browser-based PLC IDE: tasks, programs, routines, tags, UDTs, AOIs, I/O configuration, online/offline, forces, trends and a virtual factory." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2322c55e'/%3E%3Cpath d='M6 6v20M26 6v20M6 16h6M20 16h6M12 9v14M20 9v14' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⏚</span>
      <div>
        <h1>PLC Training</h1>
        <div class="subtitle">Ladder logic IDE &amp; virtual factory</div>
      </div>
    </div>
    <div class="ctl" role="group" aria-label="Controller">
      <button id="btn-online" class="btn" title="Go online to see live values">Go Online</button>
      <span id="online-badge" class="badge offline">OFFLINE</span>
      <span id="mode" class="mode stop">PROGRAM</span>
      <button id="btn-run" class="btn run" title="Controller to RUN mode (continuous scans)">▶ Run</button>
      <button id="btn-stop" class="btn stopbtn" title="Controller to PROGRAM mode; outputs turn off">■ Program</button>
      <button id="btn-step" class="btn" title="Execute exactly one controller scan">⏭ Single Scan</button>
      <button id="btn-reset-ctrl" class="btn ghost" title="Reset Controller: clear all tag values, timers and counters back to their downloaded initial values">Reset Controller</button>
      <span class="sep"></span>
      <button id="btn-download" class="btn" title="Download: send the offline project to the controller">⬇ Download</button>
      <button id="btn-upload" class="btn" title="Upload: pull the controller's running copy (with current values) into the offline project">⬆ Upload</button>
      <span id="sync-badge" class="badge"></span>
      <span class="sep"></span>
      <span id="forces-badge" class="badge"></span>
      <button id="btn-forces" class="btn small" title="Enable or disable all installed forces">Enable forces</button>
      <span class="scaninfo">Scan <span id="scan-count">0</span> · 50 ms</span>
    </div>
    <div class="file-controls">
      <select id="examples" aria-label="Examples"></select>
      <button id="btn-load-example" class="btn">Load example</button>
      <button id="btn-new" class="btn ghost">New</button>
      <button id="btn-save" class="btn ghost" title="Save project to this browser (localStorage)">Save</button>
      <button id="btn-load" class="btn ghost" title="Open project saved in this browser">Open</button>
      <button id="btn-export" class="btn ghost" title="Download project as JSON">Export</button>
      <button id="btn-import" class="btn ghost" title="Import a JSON project (v1 programs are migrated)">Import</button>
      <input id="file-import" type="file" accept="application/json,.json" hidden />
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main class="ide">
    <nav class="panel tree-panel" aria-label="Project tree">
      <div id="tree" class="tree"></div>
    </nav>

    <section class="panel center">
      <div id="view-head" class="view-head"></div>
      <div id="ladder-area" hidden>
        <div class="toolbar" role="toolbar" aria-label="Ladder editing">
          <button data-op="rung" title="Add a new rung below the selected one">+ Rung</button>
          <span class="sep"></span>
          <button data-op="NO" title="Normally-open contact (XIC)"><b>] [</b> NO</button>
          <button data-op="NC" title="Normally-closed contact (XIO)"><b>]/[</b> NC</button>
          <button data-op="branch" title="Add a parallel branch around the selected contact">+ Branch</button>
          <button data-op="CMP" title="Compare (EQU/NEQ/GRT/GEQ/LES/LEQ)">Compare</button>
          <span class="sep"></span>
          <button data-op="OTE" title="Output energize coil">( ) OTE</button>
          <button data-op="OTL" title="Output latch">(L) OTL</button>
          <button data-op="OTU" title="Output unlatch">(U) OTU</button>
          <button data-op="TON" title="Timer on-delay">TON</button>
          <button data-op="CTU" title="Count-up counter">CTU</button>
          <button data-op="RES" title="RES instruction: resets a timer or counter tag (not the controller)">RES (timer/counter reset)</button>
          <button data-op="MOV" title="Move a value">MOV</button>
          <button data-op="MATH" title="ADD / SUB / MUL / DIV">Math</button>
          <button data-op="JSR" title="Jump to subroutine">JSR</button>
          <button data-op="AOI" title="Call an Add-On Instruction">AOI</button>
          <span class="sep"></span>
          <button data-op="up" title="Move rung up">↑</button>
          <button data-op="down" title="Move rung down">↓</button>
          <button data-op="delete" class="danger" title="Delete selection (Del)">✕ Delete</button>
        </div>
        <div id="ladder" class="ladder-wrap" tabindex="0"></div>
        <div id="inspector" class="inspector"></div>
      </div>
      <div id="view-body" class="view-body"></div>
      <datalist id="tag-list"></datalist>
    </section>

    <section class="panel factory-panel">
      <div class="panel-head">
        <h2>Virtual factory</h2>
        <div class="factory-opts">
          <button id="btn-spawn" class="btn small">+ Box</button>
          <button id="btn-spawn-tall" class="btn small">+ Tall box</button>
          <label><input type="checkbox" id="auto-spawn" /> Auto infeed</label>
          <button id="btn-clear" class="btn small ghost">Clear boxes</button>
        </div>
      </div>
      <canvas id="factory" width="820" height="360" aria-label="Virtual factory conveyor"></canvas>
      <div class="hint">Tip: click a box to pick it off the conveyor by hand. Field signals reach tags through the I/O configuration.</div>
      <div class="operator">
        <div class="pb-group"><button class="pb green" data-pb="START_PB">START</button><span>START_PB</span></div>
        <div class="pb-group"><button class="pb red" data-pb="STOP_PB">STOP</button><span>STOP_PB</span></div>
        <div class="pb-group"><button class="pb gray" data-pb="RESET_PB" title="RESET pushbutton (also releases the E-STOP)">RESET</button><span>RESET_PB · releases E-stop</span></div>
        <div class="pb-group">
          <button id="estop" class="estop" aria-pressed="false" title="Push to latch the E-stop">E-STOP</button>
          <span>ESTOP (latching)</span>
        </div>
        <div class="pb-group">
          <button id="estop-release" class="btn small" disabled title="Twist-to-release the E-stop mushroom">↻ Release E-STOP</button>
          <span id="estop-state">E-stop released</span>
        </div>
      </div>
      <div class="io">
        <h3>Field I/O</h3>
        <div id="io-table" class="io-grid"></div>
      </div>
      <div id="example-desc" class="example-desc"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
